# Render Blueprint for the Srolanh Laravel API.
# In the Render dashboard: New → Blueprint → point at this repo.
# If this repo's root is the monorepo (not sls-backend), set rootDir below.
services:
  - type: web
    name: srolanh-api
    runtime: docker
    plan: free
    # If sls-backend is a subfolder of the connected repo, uncomment:
    # rootDir: sls-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ping
    envVars:
      - key: APP_NAME
        value: Srolanh
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false # set once in the dashboard: `php artisan key:generate --show`
      - key: APP_URL
        sync: false # e.g. https://srolanh-api.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: RSVP_APP_URL
        sync: false # public RSVP site URL, e.g. https://srolanh-rsvp.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false # comma-separated frontend URLs, e.g. https://admin.example.com,https://client.example.com,https://rsvp.example.com
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        sync: false # optional regex(es), e.g. #^https://.*\.vercel\.app$#
      # Database connection pulled from the managed Postgres below.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: srolanh-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: srolanh-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: srolanh-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: srolanh-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: srolanh-db
          property: password

databases:
  - name: srolanh-db
    plan: free
    databaseName: srolanh_db
    user: srolanh
